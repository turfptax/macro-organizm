<!--
  Palette checks (dataviz skill, scripts/validate_palette.js). No new colour values: every node and line colour is a
  macro.css hue token (blue, orange, aqua, yellow, magenta, green, neutral).

  The six chromatic hues, in the fixed order blue, orange, aqua, yellow, magenta, green:
    dark on #1a1a19:  CVD 8.4 PASS, normal 19.3 PASS, contrast PASS (all >= 3:1)
    light on #fcfcfb: CVD 8.8 PASS, normal 17.5 PASS, contrast PASS (all >= 3:1)
  The neutral gray has no chroma by design, so it fails the chroma floor on purpose.

  Fourteen kinds of entity and eighteen kinds of tie share these seven hues, so colour never tells two apart:
  every kind of entity has its own shape and fill, every kind of tie has its own hue and dash pattern, directed
  ties carry an arrowhead, and every node, tie and filter chip has its name as text. The Show as table button lists
  every entity and tie with all of its fields.
-->
