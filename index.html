<!--

  No new colour values: every colour is a macro.css token. Verdicts are a shape plus a word in ink (filled circle, half circle,
  half square, empty circle, diamond), never a status colour, because status colours are reserved for good and bad.
  Sparklines are the de-emphasis grey with the latest point in the accent; the bars in the first tile are accent bars, one for
  each start date and none preferred, beside one grey bar for the claim (emphasis, not categories).

  Claim 1 credit chart, three sectors in the fixed order blue, orange, aqua (households, companies, government):
    dark on #1a1a19:  lightness PASS, chroma PASS, CVD 9.4 PASS, normal 26.5 PASS, contrast PASS (all >= 3:1)
    light on #fcfcfb: lightness PASS, chroma PASS, CVD 9.4 PASS, normal 27.7 PASS, contrast PASS
  Claim 4 house price chart, blue (house price index) and orange (median new house) beside the grey reference line for consumer
  prices, and claim 5 columns where blue means a positive real return and orange a negative one (a polarity pair, not countries):
    dark:  CVD 26.8 PASS, normal 31.8 PASS, contrast PASS
    light: CVD 24.7 PASS, normal 33.6 PASS, contrast PASS
  Colour never carries identity alone: every chart with two or more series has a legend, end markers of different shapes,
  a table twin and a CSV, and the readout names the series. The single-series charts (M2 as a share of GDP, ten-year price
  growth) use the accent and need no legend.
-->
