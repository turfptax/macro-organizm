<!--
  Palette checks (dataviz skill, scripts/validate_palette.js), run for both surfaces.

  Categorical, fixed order, adjacent pairs:
    History entities  blue, orange, aqua, yellow, magenta (US, UK, China, Gold, Russia)
      light on #fcfcfb: lightness PASS, chroma PASS, CVD 8.8 PASS, normal 17.5 PASS, contrast PASS (all >= 3:1)
      dark on #1a1a19:  lightness PASS, chroma PASS, CVD 8.4 PASS, normal 19.3 PASS, contrast PASS
    Compare economies  orange, aqua, blue, magenta, green (UK, China, US, Euro area, Japan)
      light: CVD 9.4 PASS, normal 22.9 PASS, contrast PASS (all >= 3:1)
      dark:  CVD 9.4 PASS, normal 20.9 PASS, contrast PASS
  Global debt uses a neutral gray (not a categorical hue).
  The light aqua, yellow and magenta were darkened (same hue and chroma) so every series
  stroke clears 3:1 on the light card. Direct end labels, legend chips and the data table
  still carry identity as well, because the all-pairs test fails for more than three series,
  as the skill documents; identity is also carried by end-marker shape and legend hover.

  Ordinal ramps (one hue per economy, narrow aggregate = highest contrast), --ordinal:
    blue, orange, aqua, magenta, green: PASS in light and dark (monotone L, gaps >= 0.06,
    hue spread <= 1 degree). Light end (broadest aggregate) is >= 3.17:1 on light and
    >= 3.14:1 on dark, so no series stroke in either theme falls below 3:1.
    Earlier-definition (dashed) lines are drawn at full opacity so that holds for them too.
-->
</head>

<div id="app">
  <div class="viewtabs" role="tablist" aria-label="View">
    <button class="viewtab" role="tab" id="tab-money" data-view="money" aria-selected="true" aria-controls="main" type="button">Money supply</button>
    <button class="viewtab" role="tab" id="tab-history" data-view="history" aria-selected="false" aria-controls="main" type="button">Long history</button>
  </div>

  <div class="shell">
    <main id="main" class="main" tabindex="-1">
      <div class="toolbar" id="toolbar"></div>

      <section class="card chartcard" aria-labelledby="chart-title">
        <div class="chart-head">
          <h2 class="chart-title" id="chart-title"></h2>
          <p class="chart-sub" id="chart-sub"></p>
          <ul class="ladder" id="ladder" aria-label="Which aggregates exist"></ul>
          <p class="chart-note" id="ladder-note"></p>
          <p class="chart-note" id="chart-note"></p>
        </div>
        <div class="legend" id="legend" role="group" aria-label="Series"></div>
        <div class="stage" id="stage" tabindex="0" role="group"
             aria-label="Chart. Use left and right arrow keys to move the readout, plus and minus to zoom, zero to reset."></div>
        <div class="tableview" id="tableview" tabindex="0" role="region" aria-label="Data table" hidden></div>
        <div class="keyrow" id="keyrow" aria-label="Line key">
          <span><svg viewBox="0 0 26 12" aria-hidden="true"><line x1="1" y1="6" x2="25" y2="6"/></svg>Reported</span>
          <span><svg viewBox="0 0 26 12" aria-hidden="true"><line class="dash" x1="1" y1="6" x2="25" y2="6"/></svg>Estimate or earlier definition</span>
          <span><svg viewBox="0 0 26 12" aria-hidden="true"><circle cx="13" cy="6" r="4"/></svg>Hollow end: series discontinued</span>
          <span><svg class="nbadge" viewBox="-8 -8 16 16" aria-hidden="true"><circle r="7.25"/><text dy="0.34em">1</text></svg>Numbered tick: break in a series</span>
        </div>
        <div class="sr-only" id="live" aria-live="polite"></div>
      </section>
    </main>

    <aside class="card panel" id="panel" aria-label="Context">
      <div class="ptabs" id="ptabs" role="tablist" aria-label="Panel sections"></div>
      <div id="psecs"></div>
    </aside>
  </div>
</div>
