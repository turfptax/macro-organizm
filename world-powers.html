<!--
  Palette checks (dataviz skill, scripts/validate_palette.js). No new colour values: every fill and line is a macro.css token.

  Relationship layers (line colour plus dash, never colour alone): security = blue, solid; hostility = orange, dash-dot;
  economic = neutral, long dash; diplomatic = aqua, dotted.
    dark on #1a1a19:  CVD 15.7 PASS, normal 22.6 PASS, contrast PASS (all >= 3:1)
    light on #fcfcfb: CVD 18.3 PASS, normal 24.3 PASS, contrast PASS
  The neutral line is a gray by design, so the lightness band and chroma floor checks do not apply to it; its identity
  is the long dash, the legend and the layer named in every detail row, table row and tooltip.

  Entity colours (US blue, China aqua, UK orange, EU magenta, Japan green, Russia magenta) are the shared tokens used on
  Money Over Time and Money Flow; every other state is neutral. Over five hues the CVD check fails (magenta against aqua
  under deutan), as the skill documents for categorical sets this size, so colour is never what names a state:
  every node has its name in the key, detail, table and tooltip, labels on the larger nodes, and its own shape and fill
  by kind (state circle, organisation of states square, self-governing territory hollow circle). EU and Russia share
  magenta in the shared tokens; the EU is a square, Russia a circle.
-->
</head>
